<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d110f" />
  <title>Skyline Mobile · Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(82,104,87,.28), transparent 55%), #0d110f;
      color: #f0f4f1; font-family: 'Quicksand', sans-serif; }
    main { width: min(100%, 460px); padding: 38px 30px; text-align: center;
      background: rgba(22,28,24,.92); border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px; box-shadow: 0 24px 80px rgba(0,0,0,.48); }
    .mark { color: #d4836a; font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
    h1 { margin: 18px 0 12px; font: 700 clamp(27px, 7vw, 36px) 'Comfortaa', sans-serif; }
    p { color: #b8cbb9; line-height: 1.7; margin: 0 0 24px; }
    .status { display: inline-block; padding: 8px 12px; margin-bottom: 22px; border-radius: 99px;
      background: rgba(212,131,106,.14); color: #e5a995; font-size: 12px; font-weight: 700; }
    a { display: inline-flex; justify-content: center; width: 100%; padding: 14px 18px;
      border-radius: 12px; background: #d4836a; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body data-device-page="mobile">
  <main id="mobileComingSoon" hidden>
    <div class="mark">Skyline · Lofi retreat</div>
    <h1>Something cozy is on the way.</h1>
    <span class="status">Mobile experience in progress</span>
    <p>We're working on a Skyline experience made for your phone. The mobile version isn't ready just yet, but this is where it will live.</p>
    <a href="./index.html">Back to desktop site</a>
  </main>
  <script src="./js/device-gate.js"></script>
</body>
</html>
